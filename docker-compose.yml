services:
  db:
    image: postgres:17-alpine
    container_name: billsplit-db
    environment:
      POSTGRES_USER: billsplit
      POSTGRES_PASSWORD: billsplit
      POSTGRES_DB: billsplit
    ports:
      - "5433:5432"
    volumes:
      - billsplit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billsplit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  billsplit-data:
